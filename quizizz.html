<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unblocker - Quizizz</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .quiz-container {
            background: var(--light-bg);
            border-radius: 15px;
            padding: 30px;
            margin: 20px 0;
        }

        .quiz-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .quiz-question {
            background: var(--dark-bg);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .quiz-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .quiz-option {
            background: var(--light-bg);
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .quiz-option:hover {
            background: var(--primary-color);
            transform: translateY(-2px);
        }

        .quiz-option.correct {
            background: var(--success-color);
        }

        .quiz-option.incorrect {
            background: var(--danger-color);
        }

        .quiz-progress {
            width: 100%;
            height: 10px;
            background: var(--dark-bg);
            border-radius: 5px;
            margin: 20px 0;
        }

        .quiz-progress-bar {
            height: 100%;
            background: var(--primary-color);
            border-radius: 5px;
            transition: width 0.3s ease;
        }

        .quiz-score {
            text-align: center;
            font-size: 1.5rem;
            margin: 20px 0;
        }

        .quiz-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .quiz-button {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            background: var(--primary-color);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .quiz-button:hover {
            background: var(--accent-color);
            transform: translateY(-2px);
        }

        .quiz-button:disabled {
            background: var(--dark-bg);
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="floating-particles" id="particles"></div>
    
    <div class="container">
        <nav class="navbar">
            <h1>Quizizz</h1>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="welcome.html">Welcome</a>
                <a href="chat.html">Chat</a>
                <a href="unblockers.html">Unblockers</a>
            </div>
        </nav>

        <div class="content">
            <div class="quiz-container">
                <div class="quiz-header">
                    <h2>Quiz Time!</h2>
                    <p>Test your knowledge with these questions</p>
                </div>

                <div class="quiz-progress">
                    <div class="quiz-progress-bar" style="width: 0%"></div>
                </div>

                <div class="quiz-question">
                    <h3>Question 1</h3>
                    <p>What is the capital of France?</p>
                    <div class="quiz-options">
                        <div class="quiz-option" onclick="checkAnswer(this, 'Paris')">Paris</div>
                        <div class="quiz-option" onclick="checkAnswer(this, 'London')">London</div>
                        <div class="quiz-option" onclick="checkAnswer(this, 'Berlin')">Berlin</div>
                        <div class="quiz-option" onclick="checkAnswer(this, 'Madrid')">Madrid</div>
                    </div>
                </div>

                <div class="quiz-score">
                    Score: <span id="score">0</span>
                </div>

                <div class="quiz-controls">
                    <button class="quiz-button" onclick="nextQuestion()">Next Question</button>
                    <button class="quiz-button" onclick="resetQuiz()">Reset Quiz</button>
                </div>
            </div>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
        // Quiz functionality
        const questions = [
            {
                question: "What is the capital of France?",
                options: ["Paris", "London", "Berlin", "Madrid"],
                correct: "Paris"
            },
            {
                question: "What is 2 + 2?",
                options: ["3", "4", "5", "6"],
                correct: "4"
            },
            {
                question: "What is the largest planet in our solar system?",
                options: ["Earth", "Mars", "Jupiter", "Saturn"],
                correct: "Jupiter"
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        function updateProgress() {
            const progress = (currentQuestion / questions.length) * 100;
            document.querySelector('.quiz-progress-bar').style.width = `${progress}%`;
        }

        function updateQuestion() {
            const question = questions[currentQuestion];
            document.querySelector('.quiz-question h3').textContent = `Question ${currentQuestion + 1}`;
            document.querySelector('.quiz-question p').textContent = question.question;
            
            const options = document.querySelectorAll('.quiz-option');
            question.options.forEach((option, index) => {
                options[index].textContent = option;
                options[index].classList.remove('correct', 'incorrect');
            });
        }

        function checkAnswer(element, answer) {
            const correct = questions[currentQuestion].correct;
            if (answer === correct) {
                element.classList.add('correct');
                score++;
                document.getElementById('score').textContent = score;
            } else {
                element.classList.add('incorrect');
                const correctElement = Array.from(document.querySelectorAll('.quiz-option'))
                    .find(el => el.textContent === correct);
                correctElement.classList.add('correct');
            }
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                updateQuestion();
                updateProgress();
            } else {
                alert(`Quiz completed! Your score: ${score}/${questions.length}`);
                resetQuiz();
            }
        }

        function resetQuiz() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('score').textContent = '0';
            updateQuestion();
            updateProgress();
        }

        // Initialize quiz
        updateQuestion();
        updateProgress();
</script>
</body>
</html>
