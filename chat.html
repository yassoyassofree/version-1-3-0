<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unblocker - Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 70vh;
            background: var(--light-bg);
            border-radius: 15px;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 15px;
            max-width: 70%;
            word-wrap: break-word;
        }

        .message.sent {
            background: var(--primary-color);
            margin-left: auto;
        }

        .message.received {
            background: var(--dark-bg);
        }

        .chat-input {
            display: flex;
            padding: 15px;
            background: var(--dark-bg);
        }

        .chat-input input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 25px;
            margin-right: 10px;
            background: var(--light-bg);
            color: white;
        }

        .chat-input button {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            background: var(--primary-color);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .chat-input button:hover {
            background: var(--accent-color);
            transform: translateY(-2px);
        }

        .user-list {
            background: var(--dark-bg);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .user-list h3 {
            margin-bottom: 10px;
        }

        .user-item {
            padding: 8px;
            margin: 5px 0;
            background: var(--light-bg);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .user-item:hover {
            background: var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="floating-particles" id="particles"></div>
    
    <div class="container">
        <nav class="navbar">
            <h1>Unblocker Chat</h1>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="welcome.html">Welcome</a>
                <a href="unblockers.html">Unblockers</a>
                <a href="sound board.html">Sound Board</a>
            </div>
        </nav>

        <div class="content">
            <div class="user-list">
                <h3>Online Users</h3>
                <div id="onlineUsers">
                    <!-- Online users will be listed here -->
                </div>
            </div>
            
            <div class="chat-container">
                <div class="chat-messages" id="chatMessages">
                    <!-- Messages will appear here -->
                </div>
                <div class="chat-input">
                    <input type="text" id="messageInput" placeholder="Type your message...">
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
        // Chat functionality
        const chatMessages = document.getElementById('chatMessages');
            const messageInput = document.getElementById('messageInput');
        const onlineUsers = document.getElementById('onlineUsers');

        function sendMessage() {
            const message = messageInput.value.trim();
            if (message) {
                const messageElement = document.createElement('div');
                messageElement.className = 'message sent';
                messageElement.textContent = message;
                chatMessages.appendChild(messageElement);
                messageInput.value = '';
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Simulate receiving messages
        function simulateMessage() {
            const messages = [
                "Hello!",
                "How are you?",
                "This is a test message",
                "The chat is working!"
            ];
            const randomMessage = messages[Math.floor(Math.random() * messages.length)];
            
            const messageElement = document.createElement('div');
            messageElement.className = 'message received';
            messageElement.textContent = randomMessage;
            chatMessages.appendChild(messageElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Simulate online users
        function updateOnlineUsers() {
            const users = ['User1', 'User2', 'User3', 'User4'];
            onlineUsers.innerHTML = '';
            users.forEach(user => {
                const userElement = document.createElement('div');
                userElement.className = 'user-item';
                userElement.textContent = user;
                onlineUsers.appendChild(userElement);
            });
        }

        // Initialize chat
                updateOnlineUsers();
        setInterval(simulateMessage, 5000);
    </script>
</body>
</html>
